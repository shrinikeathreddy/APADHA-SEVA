<!DOCTYPE html>
<html>
<head>
    <title>APADHA SEVA - Ambulance Booking</title>

    <style>
        body{
            margin:0;
            font-family: Arial, sans-serif;

            background-image: url("indian-flag.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            height:100vh;
        }

        .madeinindia{
            position:absolute;
            top:20px;
            right:20px;
            background:#ff9933;
            color:white;
            padding:10px 20px;
            border-radius:20px;
            font-weight:bold;
        }

        .container{
            width:450px;
            margin:80px auto;
            background:rgba(255,255,255,0.9);
            padding:30px;
            border-radius:15px;
            box-shadow:0px 0px 20px gray;
        }

        h1{
            text-align:center;
            color:#d62828;
        }

        label{
            font-weight:bold;
        }

        input,select{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
        }

        button{
            width:100%;
            padding:12px;
            background:#28a745;
            color:white;
            border:none;
            font-size:18px;
            cursor:pointer;
            border-radius:5px;
        }

        button:hover{
            background:#218838;
        }

        .emergency{
            text-align:center;
            color:red;
            font-weight:bold;
            margin-top:15px;
        }
    </style>
</head>

<body>

<div class="madeinindia">
    🇮🇳 MADE IN INDIA
</div>

<div class="container">

    <h1>🚑 APADHA SEVA</h1>

    <form>

        <label>Patient Name</label>
        <input type="text" placeholder="Enter Name">

        <label>Phone Number</label>
        <input type="tel" placeholder="Enter Phone Number">

        <label>Emergency Type</label>
        <select>
            <option>Emergency</option>
            <option>Accident</option>
            <option>Heart Attack</option>
            <option>Check Up</option>
            <option>Dead Body Transport</option>
        </select>

        <label>Location</label>
        <input type="text" placeholder="Enter Current Location">

        <label>Hospital Name</label>
        <input type="text" placeholder="Enter Hospital Name">

        <button type="submit">
            BOOK AMBULANCE
        </button>

    </form>

    <div class="emergency">
        Emergency Helpline: 108
    </div>

</div>

</body>
</html>
