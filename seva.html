<!DOCTYPE html>
<html>
<head>
    <title>APADHA SEVA</title>
</head>
<body>

    <h1>WELCOME TO APADHA SEVA</h1>

    <p>Select Language:</p>
    <button>English</button>
    <button>Telugu</button>

    <hr>

    <h2>Book an Ambulance</h2>

    <form>
        <label>Patient Name:</label><br>
        <input type="text" placeholder="Enter Name"><br><br>

        <label>Phone Number:</label><br>
        <input type="tel" placeholder="Enter Phone Number"><br><br>

        <label>Emergency Type:</label><br>
        <select>
            <option>Emergency</option>
            <option>Check Up</option>
            <option>Dead Person Transport</option>
        </select><br><br>

        <label>Location:</label><br>
        <input type="text" placeholder="Enter Location"><br><br>

        <label>Hospital Name:</label><br>
        <input type="text" placeholder="Enter Hospital Name"><br><br>

        <button type="submit">Book Ambulance</button>
    </form>

    <hr>

    <h2>Emergency Numbers</h2>
    <p>Ambulance: 108</p>
    <p>Police: 100</p>
    <p>Fire: 101</p>

</body>
</html>
